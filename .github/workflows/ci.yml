name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: fleet-sim/go.mod
          cache-dependency-path: fleet-sim/go.sum

      - name: Go tests
        working-directory: fleet-sim
        run: |
          go vet ./...
          go test ./...

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - name: Agent safety tests
        run: npm test -w agent

      - name: Start the simulator
        working-directory: fleet-sim
        run: |
          go build -o /tmp/fleet-sim .
          /tmp/fleet-sim &
          for i in $(seq 1 30); do curl -sf localhost:8080/healthz && break; sleep 1; done

      # The mock diagnoser needs no model or API key, so this runs free on every push. It checks the
      # harness, the scenarios and the approval gate end to end; the script exits non-zero if any
      # high-risk action ran without approval.
      - name: Evals (mock diagnoser)
        working-directory: evals
        env:
          LLM_PROVIDER: mock
        run: npx tsx run.ts --label ci-mock

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: |
            evals/report.md
            evals/results.json
